{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm animate-fade-up">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock-fill text-primary" style="font-size: 2.5rem;"></i>
                    <h2 class="mt-2">Reset Password</h2>
                    <p class="text-muted small">Enter your new password below to complete recovery.</p>
                </div>
                <div id="alert-container"></div>
                <form id="direct-reset-form">
                    <input type="hidden" id="reset-email" value="">
                    <input type="hidden" id="reset-otp" value="">

                    <div class="mb-3">
                        <label class="form-label text-muted small">Account Email</label>
                        <input type="text" class="form-control bg-light" id="display-email" readonly>
                    </div>

                    <div class="mb-3">
                        <label for="new_password" class="form-label">New Password</label>
                        <input type="password" class="form-control" id="new_password" required minlength="6" placeholder="Enter new password">
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm New Password</label>
                        <input type="password" class="form-control" id="confirm_password" required minlength="6" placeholder="Confirm new password">
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" id="submit-btn" class="btn btn-primary btn-lg">Update Password</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <p class="small text-muted mb-0"><a href="{{ url_for('login_page') }}">Back to Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email') || '';
    const otp = urlParams.get('otp') || '';

    const emailInput = document.getElementById('reset-email');
    const displayEmail = document.getElementById('display-email');
    const otpInput = document.getElementById('reset-otp');
    const form = document.getElementById('direct-reset-form');

    if (email) {
        emailInput.value = email;
        displayEmail.value = email;
    }
    if (otp) {
        otpInput.value = otp;
    }

    if (!email || !otp) {
        const container = document.getElementById('alert-container');
        if (container) {
            container.innerHTML = `<div class="alert alert-warning">
                <strong>Invalid or Missing Reset Link:</strong> Please request a new password recovery link from the <a href="/forgot-password">Forgot Password</a> page.
            </div>`;
        }
        document.getElementById('submit-btn').disabled = true;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const pwd = document.getElementById('new_password').value;
        const confirmPwd = document.getElementById('confirm_password').value;
        const btn = document.getElementById('submit-btn');

        if (pwd !== confirmPwd) {
            alert('Passwords do not match');
            return;
        }

        btn.disabled = true;
        btn.innerText = 'Updating Password...';

        try {
            const res = await fetch('/api/auth/verify-reset-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: emailInput.value,
                    otp: otpInput.value,
                    password: pwd
                })
            });
            const data = await res.json();
            if (res.ok) {
                alert(data.message || 'Password updated successfully! Please log in.');
                window.location.href = '/login';
            } else {
                alert(data.error || 'Failed to update password');
                btn.disabled = false;
                btn.innerText = 'Update Password';
            }
        } catch (err) {
            alert('Network error. Please try again.');
            btn.disabled = false;
            btn.innerText = 'Update Password';
        }
    });
});
</script>
{% endblock %}
