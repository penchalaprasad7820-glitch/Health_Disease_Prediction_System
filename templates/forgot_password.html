{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm animate-fade-up">
            <div class="card-body p-5">
                <h2 class="text-center mb-4">Forgot Password</h2>
                <div id="alert-container"></div>
                <form id="forgot-form">
                    <div id="email-section">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="button" id="send-otp-btn" class="btn btn-primary btn-lg">Send OTP</button>
                        </div>
                    </div>
                    
                    <div id="otp-section" style="display: none;">
                        <div class="mb-3">
                            <label for="otp" class="form-label">Enter 6-digit OTP</label>
                            <input type="text" class="form-control" id="otp" maxlength="6">
                        </div>
                        <div class="mb-3">
                            <label for="new_password" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="new_password">
                        </div>
                        <div class="mb-3">
                            <label for="confirm_new_password" class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" id="confirm_new_password">
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" id="reset-btn" class="btn btn-primary btn-lg">Verify & Reset Password</button>
                        </div>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <p>Remember your password? <a href="{{ url_for('login_page') }}">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
